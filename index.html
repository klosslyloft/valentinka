<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>С 14 февраля ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Playfair Display', serif;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* 🌸 фон */
canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  text-align: center;
  perspective: 1200px;
}

/* ❤️ сердце */
.heart {
  width: 260px;
  margin: 0 auto 30px;
  cursor: pointer;
}

.heart path {
  fill: #e60023;
  transition: transform 1.4s cubic-bezier(.25,.8,.25,1);
  transform-origin: center;
}

/* левая и правая половины */
.left {
  transform-origin: right center;
}

.right {
  transform-origin: left center;
}

/* РАСКРЫТИЕ */
.heart.open .left {
  transform: rotateY(-55deg);
}

.heart.open .right {
  transform: rotateY(55deg);
}

/* кнопка */
button {
  padding: 14px 32px;
  font-size: 16px;
  background: transparent;
  border: 1.5px solid #e60023;
  color: #e60023;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #e60023;
  color: white;
}

/* письмо */
.letter {
  max-width: 340px;
  margin: 30px auto 0;
  padding: 24px;
  border: 1px solid #e60023;
  opacity: 0;
  transform: translateY(20px);
  transition: 0.9s ease;
}

.letter.show {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container">

<svg class="heart" viewBox="0 0 512 512" onclick="openHeart()" id="heart">
  <path class="left"
    d="M256 464s-192-112-192-272c0-53 43-96 96-96 44 0 82 29 96 70 14-41 52-70 96-70 53 0 96 43 96 96 0 160-192 272-192 272z"
    clip-path="inset(0 50% 0 0)" />
  <path class="right"
    d="M256 464s-192-112-192-272c0-53 43-96 96-96 44 0 82 29 96 70 14-41 52-70 96-70 53 0 96 43 96 96 0 160-192 272-192 272z"
    clip-path="inset(0 0 0 50%)" />
</svg>

<button onclick="openHeart()">Открыть письмо</button>

<div class="letter" id="letter">
  С 14 февраля 💖<br><br>
  Для меня ты очень дорогой человек,<br>
  и я невероятно ценю тебя.<br><br>
  Спасибо тебе за время,<br>
  проведённое вместе.<br><br>
  Люблю &lt;3
</div>

</div>

<script>
function openHeart() {
  document.getElementById('heart').classList.add('open');
  document.getElementById('letter').classList.add('show');
}

/* 🌸 частицы */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

const particles = Array.from({ length: 40 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 2 + 1,
  v: Math.random() * 0.4 + 0.2
}));

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.y -= p.v;
    if (p.y < 0) p.y = canvas.height;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(230,0,35,0.25)';
    ctx.fill();
  });
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
